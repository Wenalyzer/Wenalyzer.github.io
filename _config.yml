# Site settings
title: 文凱 - 個人網站
description: 鍾文凱的個人網站與履歷

# Build settings
plugins:
  - jekyll-sitemap

# Files to exclude from processing
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

# Enable direct HTML processing
markdown: kramdown
highlighter: rouge

# Keep certain files during build
keep_files:
  - CNAME
  - .nojekyll
  - resume.html
  - assets/